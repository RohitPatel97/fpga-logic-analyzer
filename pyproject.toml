[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-logic-analyzer"
version = "0.1.0"
description = "SystemVerilog logic analyzer with Renode co-simulation and a Python waveform workbench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logic-analyzer = "logic_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
